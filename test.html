<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D модель — тест</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #111;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 10px 0 20px;
    color: #f5a623;
  }
  model-viewer {
    width: 100%;
    max-width: 700px;
    height: 500px;
    background: radial-gradient(circle at 50% 40%, #1c1c1c, #0a0a0a);
    border-radius: 12px;
  }
  .hint {
    margin-top: 14px;
    font-size: 13px;
    color: #888;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Вариант B — тест 3D модели</h1>

<model-viewer
  src="ins2.glb"
  alt="3D модель устройства"
  camera-controls
  auto-rotate
  auto-rotate-delay="1000"
  rotation-per-second="20deg"
  shadow-intensity="1"
  exposure="1.1"
  camera-orbit="35deg 75deg 150%"
  ar>
</model-viewer>

<p class="hint">Крути пальцем / мышкой, щипай для зума. На телефоне — кнопка AR внизу справа.</p>

</body>
</html>
